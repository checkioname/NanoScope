syntax = "proto3";

package cellpose;

option go_package = "/";


service CellposeService {
  rpc ProcessImage (ImageRequest) returns (ImageResponse);
}

message ImageRequest {
  bytes image_data = 1;
}

message Point {
  int32 y = 1;
  int32 x = 2;
}

message Outline {
  repeated Point points = 1;
}

message ImageResponse {
 repeated Outline outlines = 1;
  repeated int32 masks = 2;
  repeated float diams = 3;
  repeated float styles = 4; 
  repeated float rows = 5;
} 



