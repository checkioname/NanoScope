syntax = "proto3";

package meditron;

option go_package = "github.com/checkioname/api--microseg-service/internal/protos";

service MeditronService {
  rpc GenerateAnalysis (AnalysisRequest) returns (AnalysisResponse);
}

message CellFeature {
  int32 cell_id = 1;
  float area = 2;
  float perimeter = 3;
  float circularity = 4;
  float eccentricity = 5;
  float solidity = 6;
  float mean_intensity = 7;
  float max_intensity = 8;
  float min_intensity = 9;
  float intensity_std = 10;
  float texture_contrast = 11;
  float nucleus_cytoplasm_ratio = 12;
  bool is_potentially_malignant = 13;
}

message GlobalMetrics {
  int32 total_cells = 1;
  int32 potentially_malignant_cells = 2;
  float malignancy_percentage = 3;
  float cell_density_per_mm2 = 4;
  float mean_cell_size = 5;
  float cell_size_variability = 6;
  float mean_cell_intensity = 7;
  float intensity_variability = 8;
  float image_quality_score = 9;
}

message AnalysisRequest {
  repeated CellFeature cell_features = 1;
  GlobalMetrics global_metrics = 2;
  string image_context = 3;
}

message AnalysisResponse {
  string medical_analysis = 1;
  string diagnosis_summary = 2;
  string recommendations = 3;
  float confidence_score = 4;
  repeated string key_findings = 5;
  string risk_assessment = 6;
}

